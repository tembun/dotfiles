[global]
nvidia_disable_flipping=ask

[input]
audio_alsa_source=default
audio_backend=alsa
audio_enabled=false
audio_jack_connect_system_capture=true
audio_jack_connect_system_playback=false
audio_pulseaudio_source=alsa_output.pci-0000_00_1b.0.analog-stereo.monitor
glinject_auto_launch=false
glinject_channel=
glinject_command=
glinject_limit_fps=false
glinject_relax_permissions=false
glinject_working_directory=
profile=dummy
video_area=screen
video_area_follow_fullscreen=false
video_area_screen=0
video_frame_rate=15
video_h=768
video_record_cursor=true
video_scale=false
video_scaled_h=850
video_scaled_w=1360
video_w=1366
video_x=0
video_y=0

[output]
add_timestamp=false
audio_codec=vorbis
audio_codec_av=aac
audio_kbit_rate=92
audio_options=
container=mp4
container_av=3g2
file=/tmp/val.mp4
profile=dummy
separate_files=false
video_allow_frame_skipping=true
video_codec=h264
video_codec_av=alias_pix
video_h264_crf=34
video_h264_preset=1
video_kbit_rate=5000
video_options=
video_vp8_cpu_used=5

[record]
hotkey_alt=true
hotkey_ctrl=false
hotkey_enable=true
hotkey_key=17
hotkey_shift=false
hotkey_super=false
preview_frame_rate=10
schedule_num_entries=0
schedule_time_zone=local
sound_notifications_enable=false

[welcome]
skip_page=true
